[project]
name = "finagents"
version = "0.1.0"
description = "Multi-agent financial question answering over FinQA: LLM-guided planning, ML retrieval, deterministic computation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.2",        # agent orchestration: typed state, conditional routing
  "pydantic>=2.6",         # structured agent inputs and outputs
  "scikit-learn>=1.4",     # TF-IDF baseline and the learned evidence reranker
  "numpy>=1.26",
  "fastapi>=0.110",        # backend API for the frontend
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Claude backend for the LLM agents. Without it (or without credentials) every agent
# runs on its deterministic offline backend.
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27"]

[project.scripts]
finagents = "finagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length; what it cannot wrap is long strings and messages.
ignore = ["E501"]
