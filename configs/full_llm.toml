# Full system with Claude in the Query Analyst, Reasoning and Response agents.
# Needs `uv sync --extra llm` and ANTHROPIC_API_KEY (or an `ant auth login` profile).
# Without credentials every agent falls back to its deterministic backend.
name = "full_llm"
description = "Full system with Claude for query analysis, reasoning and phrasing"
retriever = "learned"
min_confidence = 0.60
use_llm = true
llm_agents = ["query_analyst", "reasoning", "response"]
llm_model = "claude-opus-5-5"
